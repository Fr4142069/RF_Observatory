version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: rf_observatory_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rf_observatory}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - rf_observatory_pgdata:/var/lib/postgresql/data
    networks:
      - rf_observatory_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rf_observatory}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: node:20-alpine
    container_name: rf_observatory_backend
    restart: unless-stopped
    # No iniciamos Express automáticamente según los requerimientos
    command: tail -f /dev/null
    environment:
      # Inyección dinámica de la URL para Prisma
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-rf_observatory}
    ports:
      - "3000:3000"
    volumes:
      # Montaje del volumen del proyecto backend
      - ../backend:/app
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rf_observatory_network

# Volumen persistente obligatorio para no perder datos al bajar el contenedor
volumes:
  rf_observatory_pgdata:
    name: rf_observatory_pgdata

# Red dedicada exclusiva para aislar RF_Observatory
networks:
  rf_observatory_network:
    name: rf_observatory_network
    driver: bridge
